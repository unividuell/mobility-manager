name: mobility-manager

services:
  mobility-manager:
    image: ghcr.io/unividuell/mobility-manager:latest
    container_name: mobility-manager
    restart: unless-stopped
    # Without a limit the buildpack's memory calculator sizes the heap from the whole host.
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: production
      MOBILITY_MANAGER_GITHUB_CLIENT_SECRET: ${MOBILITY_MANAGER_GITHUB_CLIENT_SECRET}
    volumes:
      # SQLite DB lands at ./data/mobility-manager.db on the host.
      # The dir must be owned by the buildpack run user: chown 1002:1000 ./data
      - ./data:/data
    networks:
      - edge
      # edge-caddy's edge-lgtm receives metrics and traces here (OTLP).
      - monitoring
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf ''GET /actuator/health HTTP/1.0\r\n\r\n'' >&3 && grep -q UP <&3']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Daily consistent snapshot of the SQLite DB into ./backups, kept 7 days. edge-caddy's
  # backup mirror pulls it from there to the home server.
  db-backup:
    image: alpine:3.22
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add -q --no-cache sqlite

        # Compose reads a single dollar sign as its own interpolation, so each one here is doubled.
        while true; do
          # sqlite3 would create an empty DB where none exists yet.
          if [ -f /data/mobility-manager.db ]; then
            # VACUUM INTO copies within one read transaction: consistent while the app writes.
            # Written beside the name, then renamed, so no half-written file looks like a backup.
            out=/backups/mobility-manager-$$(date +%Y%m%d-%H%M%S).db
            sqlite3 -readonly -cmd ".timeout 10000" /data/mobility-manager.db "VACUUM INTO '$$out.part'"
            mv "$$out.part" "$$out"
            find /backups -name 'mobility-manager-*.db' -mtime +7 -delete
          fi
          sleep 86400
        done

networks:
  edge:
    external: true
  monitoring:
    external: true
