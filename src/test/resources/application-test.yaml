# Test-only overrides; everything else (datasource driver, flyway, thymeleaf) is
# inherited from the base src/main/resources/application.yaml. Activated via
# @ActiveProfiles("test").
spring:
  datasource:
    # SQLite in-memory with shared cache so all Hikari connections see one DB
    # (the shared in-memory DB lives as long as >=1 connection stays open).
    # Pool > 1 is required: loading an aggregate that owns a child collection
    # (Vehicle -> vehicle_managers) needs a second connection concurrently.
    # date_class=text mirrors prod so LocalDate persists as readable ISO TEXT;
    # foreign_keys=true enforces referential integrity (mirrors prod).
    url: jdbc:sqlite:file::memory:?cache=shared&date_class=text&date_string_format=yyyy-MM-dd&foreign_keys=true
    hikari:
      maximum-pool-size: 5
  security:
    oauth2:
      client:
        registration:
          # production's door, with dummy credentials: the auth lib refuses to start
          # without any way in, and the test login below is off
          github:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: read:user

unividuell:
  auth:
    test-login:
      # an active profile would demand a key; tests sign in through MockMvc instead
      enabled: false
