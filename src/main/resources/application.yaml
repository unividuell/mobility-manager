spring:
  application:
    name: mobility-manager
  datasource:
    # date_class=text + an ISO date format make the driver store java.time
    # dates (FuelEntry.date) as readable yyyy-MM-dd TEXT instead of epoch millis.
    # foreign_keys=true enforces referential integrity (off by default in SQLite;
    # it's a per-connection PRAGMA, so it must be set on every pooled connection).
    url: jdbc:sqlite:./data/mobility-manager.db?date_class=text&date_string_format=yyyy-MM-dd&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
  session:
    # sessions are persisted to SQLite (spring-session-jdbc) so a login survives
    # an app restart; Flyway owns the schema, so Spring Session must not create it.
    jdbc:
      initialize-schema: never

server:
  port: 8080
  servlet:
    session:
      # long timeout so "stay logged in" is meaningful (the persisted session
      # otherwise still expires after 30 min of inactivity)
      timeout: 30d

# Metrics and traces go out via OTLP only in production (edge-caddy's edge-lgtm).
# Locally there is no collector: export stays off.
management:
  opentelemetry:
    # One Grafana serves several projects: these tell them apart.
    resource-attributes:
      "[service.namespace]": mobility-manager
      "[deployment.environment.name]": local
  logging:
    export:
      otlp:
        # Logs travel via the container's stdout, read by the collector, not via OTLP.
        enabled: false
  tracing:
    export:
      enabled: false
    sampling:
      # Every request; the traffic is tiny.
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
        # Default 60 s makes the dashboard feel dead while clicking through the app.
        step: 10s
  metrics:
    distribution:
      # p95 latency per endpoint in Grafana.
      percentiles-histogram:
        http.server.requests: true

unividuell:
  auth:
    # Thymeleaf + htmx: anonymous requests and logout land on /login (login.html), whose button
    # starts the sign-in at /login/start — the picker locally, GitHub in production.
    frontend: server-rendered
    login-page: /login
